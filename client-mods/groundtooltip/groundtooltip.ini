[GroundTooltip]
; ALWAYS -> INVENTORY_ONLY -> OFF -> ALWAYS
Mode=ALWAYS

; Recommended conflict-free default: the * key on the numeric keypad.
; Accepted examples: NUMPAD_MULTIPLY, F9, F10, F11, F12, SCROLL_LOCK,
; PAUSE, INSERT, HOME, END, PAGE_UP, PAGE_DOWN, A-Z, 0-9, or a VK number.
ToggleKey=NUMPAD_MULTIPLY

; Plays the vanilla data-bar button sound when the mode changes.
SoundFeedback=1

; Optional ground-tooltip category filters. 0 = show, 1 = ignore.
; These options affect ground tooltips only; inventory tooltips are unchanged.
IgnorePotions=0
IgnoreSpells=0
IgnoreQuestItems=0
IgnoreLoreBooks=1
